[platformio]
default_envs = a21_stackchan_cores3

[env:a21_stackchan_cores3]
platform = espressif32@7.0.1
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D UART_SCLK_DEFAULT=UART_SCLK_XTAL
  -D A21_FIRMWARE_ID=\"a21-stackchan\"
  -D A21_FIRMWARE_VERSION=\"0.1.0\"
  -D A21_FIRMWARE_BOARD=\"m5stack-cores3\"
  -D A21_DEVICE_ID=\"stackchan-001\"
  -D A21_GATEWAY_HOST=\"10.21.0.1\"
  -D A21_GATEWAY_PORT=21080
extra_scripts =
  pre:scripts/a21_block_raw_upload.py
  pre:scripts/a21_build_identity.py
lib_deps =
  m5stack/M5Unified @ 0.2.16
  m5stack/StackChan-BSP @ 1.1.0
  bblanchon/ArduinoJson @ 7.4.3
  links2004/WebSockets @ 2.7.3

[env:a21_stackchan_cores3_mic_probe]
extends = env:a21_stackchan_cores3
build_flags =
  ${env:a21_stackchan_cores3.build_flags}
  -D A21_ENABLE_CORES3_M5UNIFIED_MIC_CAPTURE=1
  -D A21_ENABLE_MIC_DIAGNOSTIC_PROBE=1

[env:a21_stackchan_cores3_imu_probe]
extends = env:a21_stackchan_cores3
build_flags =
  ${env:a21_stackchan_cores3.build_flags}
  -D A21_ENABLE_IMU_DIAGNOSTIC_PROBE=1

[env:a21_stackchan_cores3_avatar_spike]
extends = env:a21_stackchan_cores3
build_flags =
  ${env:a21_stackchan_cores3.build_flags}
  -D A21_ENABLE_M5STACK_AVATAR_SPIKE=1
lib_deps =
  ${env:a21_stackchan_cores3.lib_deps}
  meganetaaan/M5Stack-Avatar @ 0.10.0

[env:a21_stackchan_native]
platform = native
test_framework = unity
build_flags =
  -D A21_FIRMWARE_ID=\"a21-stackchan\"
  -D A21_FIRMWARE_VERSION=\"0.1.0\"
  -D A21_FIRMWARE_BOARD=\"m5stack-cores3\"
  -D A21_DEVICE_ID=\"stackchan-001\"
  -D A21_GATEWAY_HOST=\"10.21.0.1\"
  -D A21_GATEWAY_PORT=21080
  -D A21_IGNORE_LOCAL_SECRETS=1
extra_scripts =
  pre:scripts/a21_block_raw_upload.py
  pre:scripts/a21_build_identity.py
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
