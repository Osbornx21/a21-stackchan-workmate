name: A21 CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run A21 lean gate
        run: bash scripts/lean-gate.sh

      - name: Run A21 release check
        run: make release-check
